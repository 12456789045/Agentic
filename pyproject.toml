[project]
name = "agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hrishikesh Kulkarni", email = "Kulkarnihrishikesh2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.2",
    "faiss-cpu>=1.15.1",
    "gradio>=6.31.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langgraph-cli[inmem]>=0.4.40",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
agentic = "agentic:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"



