[project]
name = "agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hrishikesh Kulkarni", email = "Kulkarnihrishikesh2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentic = "agentic:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
